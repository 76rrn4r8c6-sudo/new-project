<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="X10, AI 기반 10m 공기권총 훈련 보조 및 경기력 향상 애플리케이션"
    />
    <title>X10 Training OS</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="X10 main navigation">
        <a class="brand" href="#dashboard" aria-label="X10 dashboard">
          <img src="./assets/images/x10-logo.png" alt="X10" />
        </a>
        <nav class="nav-list" id="navList"></nav>
      </aside>

      <main class="app-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">10M AIR PISTOL × AI</p>
            <h1 id="pageTitle">X10</h1>
          </div>
          <div class="topbar-actions">
            <span class="chip chip-gold" id="todayChip"></span>
            <button class="icon-button" id="exportBtn" type="button" title="훈련 데이터 내보내기">
              <span data-icon="download"></span>
            </button>
          </div>
        </header>

        <section id="appView" class="view" aria-live="polite"></section>
      </main>

      <footer class="mobile-nav" id="mobileNav" aria-label="X10 mobile navigation"></footer>
    </div>
  </body>
</html>
